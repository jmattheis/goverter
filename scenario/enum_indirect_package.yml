input:
    input.go: |
        package example

        import (
            model "github.com/jmattheis/goverter/execution/model"
            output "github.com/jmattheis/goverter/execution/output"
        )

        // The converter does not import the enum's package (input): goverter sees it only
        // through the export data of model, which lacks the constants.
        // goverter:converter
        // goverter:enum:unknown @panic
        type Converter interface {
            Convert(model.Input) output.Output
        }
    input/enum.go: |
        package input

        type Color string

        const (
            Green Color = "green"
            Blue  Color = "blue"
        )
    model/model.go: |
        package model

        import "github.com/jmattheis/goverter/execution/input"

        type Input struct {
            Color input.Color
        }
    output/enum.go: |
        package output

        type Color string

        const (
            Green Color = "green"
            Blue  Color = "blue"
        )

        type Output struct {
            Color Color
        }
success:
    - generated/generated.go: |
        // Code generated by github.com/jmattheis/goverter, DO NOT EDIT.

        package generated

        import (
        	"fmt"
        	input "github.com/jmattheis/goverter/execution/input"
        	model "github.com/jmattheis/goverter/execution/model"
        	output "github.com/jmattheis/goverter/execution/output"
        )

        type ConverterImpl struct{}

        func (c *ConverterImpl) Convert(source model.Input) output.Output {
        	var outputOutput output.Output
        	outputOutput.Color = c.inputColorToOutputColor(source.Color)
        	return outputOutput
        }
        func (c *ConverterImpl) inputColorToOutputColor(source input.Color) output.Color {
        	var outputColor output.Color
        	switch source {
        	case input.Blue:
        		outputColor = output.Blue
        	case input.Green:
        		outputColor = output.Green
        	default:
        		panic(fmt.Sprintf("unexpected enum element: %v", source))
        	}
        	return outputColor
        }
