input:
    input.go: |
        package maps

        // goverter:converter
        type Converter interface {
            Convert(source map[string]string) map[string]string
        }
global:
    - useEmptyMapOnNil yes
success:
    - generated/generated.go: |
        // Code generated by github.com/jmattheis/goverter, DO NOT EDIT.

        package generated

        type ConverterImpl struct{}

        func (c *ConverterImpl) Convert(source map[string]string) map[string]string {
        	var mapStringString map[string]string
        	mapStringString = make(map[string]string, len(source))
        	for key, value := range source {
        		mapStringString[key] = value
        	}
        	return mapStringString
        }
